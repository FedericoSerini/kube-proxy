<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kubernetes Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 45%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h1>Kubernetes Cluster Monitor</h1>

<div class="container">
    <!-- Pods -->
    <div class="card">
        <h2>Pods</h2>
        <table id="pods-table">
            <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>

    <!-- Kustomizations -->
    <div class="card">
        <h2>Kustomizations</h2>
        <table id="kustomizations-table">
            <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>last_applied_revision</th>
                    <th>last_attemped_revision</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadPods() {
        try {
            const response = await fetch('/v1/pods/metadata');
            const pods = await response.json();
            const table = document.getElementById('pods-table').getElementsByTagName('tbody')[0];

            pods.forEach(pod => {
                const row = table.insertRow();
                row.insertCell(0).innerText = pod.namespace;
                row.insertCell(1).innerText = pod.name;
                row.insertCell(2).innerText = pod.status;
            });
        } catch (error) {
            console.error('Error loading pods:', error);
        }
    }

    async function loadKustomizations() {
        try {
            const response = await fetch('/v1/kustomizations/metadata');
            const kustomizations = await response.json();
            const table = document.getElementById('kustomizations-table').getElementsByTagName('tbody')[0];

            kustomizations.forEach(kustomization => {
                const row = table.insertRow();
                row.insertCell(0).innerText = kustomization.namespace;
                row.insertCell(1).innerText = kustomization.name;
                row.insertCell(2).innerText = kustomization.status;
                row.insertCell(3).innerText = kustomization.last_applied_revision;
                row.insertCell(4).innerText = kustomization.last_attemped_revision;
            });
        } catch (error) {
            console.error('Error loading kustomizations:', error);
        }
    }

    window.onload = function() {
        loadPods();
        loadKustomizations();
    };
</script>

</body>
</html>
