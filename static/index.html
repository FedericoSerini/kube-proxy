<!DOCTYPE html>
<html>
<head>
  <title>Kubernetes Dashboard</title>
  <script type="module">
    import Keycloak from 'https://cdn.jsdelivr.net/npm/keycloak-js@23.0.6/+esm';

    const keycloak = new Keycloak({
      url: '{{.KeycloakBase}}',
      realm: '{{.KeycloakRealm}}',
      clientId: '{{.KeycloakClientID}}',
    });

    keycloak.init({ onLoad: 'login-required' }).then(authenticated => {
      if (!authenticated) {
        location.reload();
      }

      document.getElementById('user').textContent = keycloak.tokenParsed.preferred_username;
      window.localStorage.setItem("kc_token", keycloak.token);

      fetchData('/v1/pods/metadata', 'pods-table', keycloak.token);
      fetchData('/v1/kustomizations/metadata', 'kustomizations-table', keycloak.token);

      // Refresh token every 60 seconds
      setInterval(() => {
        keycloak.updateToken(60).then(refreshed => {
          if (refreshed) {
            localStorage.setItem("kc_token", keycloak.token);
          }
        });
      }, 60000);
    });

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('logout').onclick = () => keycloak.logout();
    });

    function fetchData(endpoint, tableId, token) {
      fetch(endpoint, {
        headers: { Authorization: 'Bearer ' + token }
      })
      .then(res => res.json())
      .then(data => {
        renderTable(data, tableId);
      })
      .catch(err => {
        document.getElementById(tableId).innerHTML = `<tr><td colspan="5">Error loading ${endpoint}</td></tr>`;
        console.error(err);
      });
    }

    function renderTable(data, tableId) {
      const table = document.getElementById(tableId);
      table.innerHTML = "";
      data.forEach(item => {
        const row = document.createElement('tr');
        Object.values(item).forEach(val => {
          const cell = document.createElement('td');
          cell.textContent = val || '-';
          row.appendChild(cell);
        });
        table.appendChild(row);
      });
    }
  </script>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    h2 { margin-top: 2em; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5em; }
    th, td { border: 1px solid #ccc; padding: 0.5em; text-align: left; }
    th { background: #f0f0f0; }
    #logout { float: right; }
  </style>
</head>
<body>
  <h1>
    Kubernetes Read-Only Dashboard
    <button id="logout">Logout</button>
  </h1>
  <p>Welcome, <strong id="user">...</strong></p>

  <h2>Pods</h2>
  <table>
    <thead>
      <tr><th>Namespace</th><th>Name</th><th>Status</th></tr>
    </thead>
    <tbody id="pods-table"><tr><td colspan="3">Loading...</td></tr></tbody>
  </table>

  <h2>Kustomizations</h2>
  <table>
    <thead>
      <tr><th>Namespace</th><th>Name</th><th>Status</th><th>Revision</th><th>Message</th></tr>
    </thead>
    <tbody id="kustomizations-table"><tr><td colspan="5">Loading...</td></tr></tbody>
  </table>
</body>
</html>
